[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsync"
version = "0.1.0"
description = "BCI Voice: LLM-ranked replies spoken for an SSVEP brain-computer interface (voice + UI side)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "anthropic>=2.3,<3",  # output_config (effort) and strict tools (app/menus.py)
    "httpx>=0.27",  # Cartesia TTS over REST (app/tts.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
