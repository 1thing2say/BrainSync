[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsync"
version = "0.1.0"
description = "Two-target SSVEP brain-computer interface for the Cerelog X8 EEG board, with BCI Voice: LLM-ranked replies spoken for it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "anthropic>=2.3,<3",  # output_config (effort) and strict tools (app/menus.py)
    "httpx>=0.27",  # Cartesia TTS over REST (app/tts.py)
    "pyserial>=3.5; sys_platform == 'win32'",  # COM port detection, PsychoPy's pyglet backend
]

[project.optional-dependencies]
display = ["psychopy>=2026.2", "pillow>=10.1"]
reels = ["websockets>=12"]
dev = ["pytest>=8", "pytest-cov>=5", "pillow>=10.1", "pytest-asyncio>=0.23"]
chess = ["chess>=1.10"]

[tool.setuptools.packages.find]
include = ["brainsync*", "app*", "tools*"]

[tool.setuptools.package-data]
brainsync = ["stimulus/configs/*.toml", "swipe_deck/*.toml", "web/*", "brainchess/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "realdata: needs recordings under $BRAINSYNC_DATA_DIR; skipped when the files are absent",
    "slow: takes more than a few seconds",
]
