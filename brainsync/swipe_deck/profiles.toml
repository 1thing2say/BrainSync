# BrainSwipe deck: invented dating profiles for the brain-controlled swipe demo.
#
# Every person here is made up. Render the cards with
#     .venv/bin/python -c "from brainsync.profiles import load_deck, render_deck; render_deck(load_deck(), 'cards')"
#
# Each [[profile]] needs name, age (an integer), color (hex accent for the drawn avatar)
# and 1 to 3 prompts as ["prompt", "answer"] pairs; detail is optional. Keep answers to
# about 120 characters so they fit on the card without shrinking.

