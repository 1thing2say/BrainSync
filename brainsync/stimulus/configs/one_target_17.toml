# One large 17 Hz square in the middle of the screen, for single-target trials
# (electrode checks, per-frequency spectra). Nothing to choose, so no cue.
name = "one_target_17"

[targets]
freqs = [17.0]
phases_pi = [0.0]
labels = ["17"]

[layout]
rows = 1
cols = 1
size = 0.7   # side length, screen heights

[stimulus]
waveform = "sine"
hold_cue = false

[display]
refresh_hz = 60.0
refresh_tolerance_hz = 1.0
screen = 0
background = 0.0
aspect = 1.5   # narrowest width/height the layout must fit (MacBooks are ~1.54)

[session]
blocks = 20
cue_s = 0.0
stim_s = 4.0
rest_s = 3.0
shuffle = false
