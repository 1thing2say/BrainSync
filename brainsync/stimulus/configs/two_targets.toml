# Live-demo pair: two large squares, look at one and the decoder says which.
# 15 and 17 Hz separated best on the user's own EEG (Cerelog X8, 60 Hz display,
# 2026-10-22); 10 Hz is unusable because it sits on the 9-10 Hz alpha peak.
# Sine flicker, because 17 Hz does not divide 60. The cue box stays on through the
# flicker: without it gaze drifted after about 2 s.
name = "two_targets"

[targets]
freqs = [15.0, 17.0]   # Hz
phases_pi = [0.0, 0.0] # multiples of pi
labels = ["15", "17"]

[layout]
rows = 1
cols = 2
size = 0.4      # side length, screen heights
spacing = 1.0   # centre to centre, screen heights: the other square sits in the periphery

[stimulus]
waveform = "sine"
hold_cue = true

[display]
refresh_hz = 60.0   # ProMotion off
refresh_tolerance_hz = 1.0
screen = 0
background = 0.0
aspect = 1.5   # narrowest width/height the layout must fit (MacBooks are ~1.54)

[session]
blocks = 10
cue_s = 1.0
stim_s = 4.0
rest_s = 3.0
shuffle = true
