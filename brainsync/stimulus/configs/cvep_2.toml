# The BrainSync c-VEP standard (docs/CVEP-STANDARD.md): two white squares, never more. One
# 63-bit m-sequence, the right square delayed by 31 frames (517 ms, the widest spacing two lags
# allow in a 63-frame cycle), so timing slips of several frames cost nothing. YES at the left
# edge, NO at the right edge of the screen, the cue box held on through the run. Each cycle is
# 63 frames = 1.05 s at 60 Hz.
name = "cvep_2"

[targets]
labels = ["YES", "NO"]   # the signage under each square, and what is spoken

[code]
length = 63
lag_frames = 31
frames_per_bit = 1

[layout]
rows = 1
cols = 2
size = 0.3      # side length, screen heights
spacing = 1.14  # centre to centre: each square at its edge of a 1.5:1 screen, as far apart
                # as the display allows

[stimulus]
hold_cue = true

[display]
refresh_hz = 60.0   # ProMotion off
refresh_tolerance_hz = 1.0
screen = 0
background = 0.0
aspect = 1.5

[session]
blocks = 6
cue_s = 1.0
stim_s = 5.25   # 5 cycles of 63 frames
rest_s = 2.0
shuffle = true
