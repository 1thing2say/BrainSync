# BrainChess board stimulus (python -m brainsync.brainchess.stimulus). The two targets are
# the PLAY / BACK panels used for the promotion and confirm steps; the board squares
# flicker at the same two frequencies, so a decoder trained on either works for both.
# 15 and 17 Hz are the only pair that separated reliably on the user's dry-electrode EEG
# (Cerelog X8, 60 Hz display, 2026-10-22). Sine flicker, because 17 Hz does not divide 60.
# The window follows the browser mockup (brainchess/style.py): the board, 0.9 screen heights
# tall, sits left of centre (x -0.71..+0.19) and a side column (x +0.235..+0.735) holds the
# prompt, the vote meters, these panels and the EEG strip. Panels 0.2 high, centres at
# x +0.335 and +0.615 (x_offset 0.475 +/- spacing/2), 0.08 apart; their footprint with the
# cue box reaches x +0.735, inside the 0.75 half-width of a 1.5:1 screen. No cue box: the
# game draws its own feedback.
name = "chess"

[targets]
freqs = [15.0, 17.0]   # Hz
phases_pi = [0.0, 0.0] # multiples of pi
labels = ["PLAY", "BACK"]

[layout]
rows = 1
cols = 2
size = 0.2       # panel side, screen heights
spacing = 0.28   # centre to centre, screen heights
x_offset = 0.475 # the pair's centre: the middle of the side column

[stimulus]
waveform = "sine"
hold_cue = false

[display]
refresh_hz = 60.0   # ProMotion off
refresh_tolerance_hz = 1.0
screen = 0
background = 0.0    # unused by the board stimulus, which paints the mockup's paper colour
aspect = 1.5   # narrowest width/height the layout must fit (MacBooks are ~1.54)

[session]
# unused by the board stimulus (the game drives it over stdin); kept valid so the stock
# stimulus can still run a cued session on the panels with -c chess
blocks = 10
cue_s = 1.0
stim_s = 4.0
rest_s = 3.0
shuffle = true
