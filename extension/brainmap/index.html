<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>BrainSync scalp map</title>
<!--
  Live scalp map of your own EEG, served by `python -m brainsync.brainmap` (see README.md).
  map.js builds the page into #brainmap and listens on /events. Nothing on this page animates
  (no CSS animation or transition; test/map.test.mjs checks): it redraws only when a frame
  arrives (4 Hz) or the window is resized. That is not shown to be safe beside the 15/17 Hz
  SSVEP squares, so the map stays on its own screen until a decoder-accuracy A/B with the
  headset (map on screen versus off).
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c10; --panel: #13151c; --line: #23262f; --text: #dcdee6; --muted: #8a8f9e;
    --ok: #7fc79a; --warn: #e6b45c; --bad: #e07a6c; --focus: #92c5de;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #brainmap { display: flex; flex-direction: column; min-height: 100vh; padding: 16px 20px; gap: 12px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .label { margin: 0; color: var(--text); background: var(--panel); border: 1px solid var(--line);
           padding: 2px 10px; border-radius: 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-left: auto; color: var(--muted); }
  .meta p { margin: 0; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
                    border-radius: 50%; background: var(--muted); vertical-align: 1px; }
  .status[data-state="streaming"]::before { background: var(--ok); }
  .status[data-state="no-data"]::before, .status[data-state="starting"]::before,
  .status[data-state="connected"]::before { background: var(--warn); }
  .status[data-state="error"]::before, .status[data-state="disconnected"]::before,
  .status[data-state="closed"]::before { background: var(--bad); }

  .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 20px; }
  .mainwrap { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .view-title { margin: 0; font-size: 16px; font-weight: 600; }
  .baseline { margin: 6px 0 0; padding: 4px 12px; min-height: 29px; border-radius: 6px;
              background: #2a2416; color: #f0d9a8; }
  /* keep its space when the baseline is ready, so the head does not jump */
  .baseline[hidden] { display: block; visibility: hidden; }
  /* 250px: header, view title, baseline line, legend and footer fit a 900 px tall window */
  canvas.main { width: min(100%, calc(100vh - 250px)); min-width: 260px; aspect-ratio: 1; height: auto; }
  /* the caption gets more room than the bar so the longer ones stay on one line */
  .legend { width: min(100%, 560px); text-align: center; }
  .legend .bar { width: min(100%, 360px); height: 12px; border-radius: 3px; display: block; margin: 0 auto; }
  .ticks { display: flex; justify-content: space-between; width: min(100%, 360px); margin: 0 auto;
           color: var(--muted); font-size: 12px; }
  .legend-text { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

  .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: #c9ccd6; background: #1c1f29; }
  .thumb { padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
  .thumb canvas { width: 100%; aspect-ratio: 1; height: auto; }
  .thumb .range { color: var(--muted); }
  .ssvep-views { display: flex; gap: 8px; }
  .ssvep-view { flex: 1; padding: 6px 8px; font-size: 12px; }

  table.electrodes { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .electrodes caption { text-align: left; color: var(--muted); padding-bottom: 2px; }
  .electrodes th, .electrodes td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); }
  .electrodes thead th { color: var(--muted); font-weight: 500; }
  .electrodes td.value { text-align: right; }
  .electrodes tr[data-quality]:not([data-quality="ok"]):not([data-quality=""]) td { color: var(--muted); }
  .electrodes tr[data-quality]:not([data-quality="ok"]):not([data-quality=""]) td.contact { color: var(--warn); }
  /* no live data: map.js fades the heads itself; the table and view title follow */
  #brainmap[data-stale="true"] .electrodes td, #brainmap[data-stale="true"] .view-title { color: var(--muted); }

  .timeline-box h2 { margin: 0 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
  canvas.timeline { width: 100%; height: auto; aspect-ratio: 5; background: var(--panel); border-radius: 6px; display: block; }
  .timeline-now { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .limits-box { border-top: 1px solid var(--line); padding-top: 8px; }
  .limits { margin: 0; max-width: 980px; color: var(--muted); font-size: 12px; }

  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; }
    canvas.main { width: 100%; }
    .meta { margin-left: 0; }
  }
</style>
</head>
<body>
<main id="brainmap"></main>
<noscript><p>The scalp map needs JavaScript.</p></noscript>
<script src="./map.js" data-autostart></script>
</body>
</html>
