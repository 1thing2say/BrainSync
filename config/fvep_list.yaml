# BCI Voice, f-VEP list mode (the 2-target fallback): SAY / NEXT on 15 / 17 Hz.
# python -m app.server --config config/fvep_list.yaml (bridge: -c two_targets). The teammate's protocol-2 bridge and
# brainsync.voice_bridge --paradigm freq speak this. The default (config/default.yaml) is c-VEP.
# Loaded and validated by app/config.py; unknown keys are an error, so typos fail loudly.

server:
  host: 127.0.0.1              # 0.0.0.0 later for a phone or the Jetson
  port: 8000
  tunnel_wait_s: 30.0          # --tunnel: how long to wait for cloudflared's address (the server
                               # listens meanwhile)

display:
  expected_refresh_hz: 60      # the bridge's hello must report this within 1 Hz (ProMotion off)

stim:
  paradigm: freq               # f-VEP: each slot flickers at its own frequency
  # The 2-target fallback (PLAN.md section 1): every option listed, one highlighted; SAY speaks
  # it, NEXT moves the highlight. 15 / 17 Hz, the pair tested with both squares flickering.
  slots:
    - {slot: s1, freq_hz: 15.0, phase_deg: 0}
    - {slot: s2, freq_hz: 17.0, phase_deg: 0}
  roles:
    s1: say
    s2: next
  confirm:                     # unused in list mode (no confirm step)
    say: s1
    back: s2
  waveform: sine
  cue_s: 1.0                   # option shown, no flicker, before each trial
  max_trial_s: 10.0            # no selection by then -> NOT_CAUGHT (decoder needs about 5 s)
  rest_s: 1.0                  # still screen after a trial

baseline:
  seconds: 10.0                # still screen at start for the decoder's resting baseline
  timeout_s: 15.0              # no baseline_done from the bridge by then -> pause

menus:
  mode: list                   # list: every option listed, SAY / NEXT on 2 targets
  dynamic: true                # false = fallback lists from intents.yaml only
  option_count: 3              # ranked options per page, most likely first (one per option slot)
  spare_options: 1             # extra candidates Claude writes, ranked last (0-3): one fills the page
                               # when an option is invalid or repeats one already shown
  label_max_chars: 18
  label_max_words: 3
  utterance_max_words: 14

llm:
  model: claude-haiku-5-5
  timeout_s: 4.0               # all calls of a page (first, hedge, retry) in this time, then fallback list
  hedge_after_s: 2.5           # no answer by then -> a second, identical call; the first good answer
                               # wins. Good pages took 1.9 s median, 3.4 s max (2026-10-24); 0 = off
  keepalive_s: 20.0            # while idle, a free API call this often keeps the connection open; 0 = off

context:
  history_turns: 8             # partner + user turns sent to the LLM

speech:
  provider: cartesia           # cartesia, or browser (speechSynthesis only); key from .env CARTESIA_API_KEY
  voice_id: 47c38ca4-5f35-497b-b1a3-415245fb35e1   # Cartesia voice
  model: sonic-3.5             # pinned; never sonic-latest
  api_version: "2026-03-01"    # Cartesia-Version header
  language: en
  format: mp3                  # mp3 (about 17 KB a sentence) or wav (pcm_s16le, about 180 KB at
                               # 44.1 kHz); venue Wi-Fi slowed to ~30 KB/s at times (2026-10-24)
  sample_rate: 22050
  bit_rate: 64000              # mp3 only
  cache_dir: cache/tts         # clips kept on disk (gitignored): they survive a restart, and the
                               # fixed lists are pre-generated (python tools/prerender_tts.py)
  tts_timeout_s: 8.0           # per clip, once sent; slower or failed -> the browser speaks it.
                               # A clip is needed >= 13 s after its page appears; venue Wi-Fi alone
                               # took 1-3 s per request (2026-10-24), so 2 s timed every clip out.
  max_concurrent: 2            # Cartesia plan limit (HTTP 429 concurrency_limited above it)
  tts_rate: 1.0                # speechSynthesis fallback only
  stt_mode: always             # always: the mic listens the whole session, hands-free, except while
                               # a reply plays, paused, idle or muted; turn: listen_window_s at the
                               # start and after each reply; push_to_talk: only the Listen button
  listen_window_s: 10.0        # turn mode, and the Listen button while paused
  stt_tail_s: 0.5              # wait after a reply ends before listening (raise to ~0.8 for a
                               # Bluetooth speaker), so it never hears itself
  stt_interrupts: question     # question: a spoken question may stop a page trial (never a pick in
                               # progress); never: every spoken line waits for the next cue.
                               # Typed text always interrupts
  stt_interrupt_cooldown_s: 20.0  # at most one spoken interrupt in this time; 0 = no limit
  stt_gap_s: 1.2               # silence that ends a partner line
  stt_max_line_s: 15.0         # a line is sent after this long even if the partner keeps talking
  stt_echo_s: 4.0              # lines heard this soon after the mic reopens are checked for echo
  start_muted: false           # true = the session starts with the mic muted
  max_speak_s: 15.0            # move on if the browser never reports tts_done (no page open)

selection:
  confirm_mode: never          # SAY is already a deliberate 2-class choice
  chosen_highlight_s: 0.6      # how long the picked target stays highlighted
