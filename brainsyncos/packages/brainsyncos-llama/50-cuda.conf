# 50-cuda.conf - brainsyncos-llama.service on a Jetson (package
# brainsyncos-llama-cuda): what the CUDA backend needs from the sandbox.
[Service]
# The GPU's device nodes (/dev/nvmap, /dev/nvgpu/..., /dev/nvhost-*), owned
# by group video. Which nodes a DeviceAllow= list needs is still to be read
# on an Orin (Phase 3e); until then the service sees /dev as usual.
PrivateDevices=no
SupplementaryGroups=video render
# Not tested with CUDA (no Orin here): NVIDIA's driver may need memory that
# is writable and executable. Off until it is checked on the device.
MemoryDenyWriteExecute=no
